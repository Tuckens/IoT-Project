# /etc/nginx/sites-available/iot-dashboard
#
# Shared-Wi-Fi threat model: any attendee can ARP-spoof the LAN. We therefore
# force the browser dashboard onto TLS (self-signed certificate is fine for the
# demo), while keeping the ESP32 ingest endpoint on plain HTTP — that is the
# intentional flaw of the project.

server {
    listen 80;
    server_name bpem.local _;

    # Only the ESP ingest route stays on HTTP (pedagogical flaw).
    location = /api/blog/sensor {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Everything else is redirected to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name bpem.local _;

    ssl_certificate     /etc/nginx/certs/iot-dashboard.crt;
    ssl_certificate_key /etc/nginx/certs/iot-dashboard.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/camera/stream {
        proxy_pass http://127.0.0.1:5000;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
