# /etc/nginx/sites-available/bpem.vdrfinances.be
#
# Public reverse proxy in front of the Pi's own nginx.
# Architecture:
#
#   Browser ──HTTPS (Let's Encrypt)──▶ drogoserver (this file)
#                                   │
#                                   └──HTTPS (self-signed CA)──▶ Pi's nginx
#                                                              │
#                                                              └──HTTP──▶ gunicorn
#
# Why two nginx layers:
#   - The Pi's cert is signed by the local CA (valid for bpem.local only)
#     and cannot be made public; a real Let's Encrypt cert on the VPS
#     terminates TLS for the public hostname instead.
#   - The Pi's own nginx still redirects 80→443 for all paths except the
#     ESP ingest, so we proxy straight to its 443 port and skip the
#     redirect round-trip.
#
# First-time setup on drogoserver:
#
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo cp deploy/nginx-external.conf /etc/nginx/sites-available/bpem.vdrfinances.be
#   sudo ln -s ../sites-available/bpem.vdrfinances.be /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bpem.vdrfinances.be   # rewrites this file to add TLS
#
# After certbot runs, the 443 server block below will already have
# ssl_certificate / ssl_certificate_key set correctly.

# 1) Plain HTTP -> HTTPS. certbot keeps this block to satisfy the HTTP-01
#    challenge on renewals.
server {
    listen 80;
    server_name bpem.vdrfinances.be;
    return 301 https://$server_name$request_uri;
}

# 2) HTTPS terminator
server {
    listen 443 ssl http2;
    server_name bpem.vdrfinances.be;

    # certbot fills these in:
    # ssl_certificate     /etc/letsencrypt/live/bpem.vdrfinances.be/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bpem.vdrfinances.be/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Enough for video downloads to pass through the proxy.
    client_max_body_size 50m;

    location / {
        # Reach the Pi over HTTPS (it listens on 443 for everything
        # except the ESP ingest). Accept the Pi's self-signed CA cert
        # without verification — the LAN link between drogoserver and
        # the Pi is trusted, and the CA private key never leaves the Pi.
        proxy_pass https://192.168.1.26:443;
        proxy_ssl_verify off;

        # Sanitise X-Forwarded-For: REPLACE any value the client may
        # have tried to inject with the real $remote_addr. The Pi's
        # nginx then appends its own $remote_addr (our external IP),
        # giving gunicorn a clean two-element list.
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Host              $host;

        # /api/camera/stream is a never-ending MJPEG multipart response.
        # Turn off buffering or nginx holds everything in RAM forever.
        proxy_buffering     off;
        proxy_read_timeout  3600s;
    }
}
