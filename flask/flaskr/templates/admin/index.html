<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background-color: #0b1320;
            color: #dde6f0;
            min-height: 100vh;
        }

        /* ── Top bar ── */
        .topbar {
            background: linear-gradient(135deg, #111e30 0%, #182840 100%);
            padding: 14px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(77, 163, 255, 0.18);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .topbar h1 {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
        }

        .topbar h1 span {
            color: #4da3ff;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.25);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: #4ade80;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #22c55e;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        /* ── Main layout ── */
        .dashboard {
            display: flex;
            gap: 18px;
            padding: 18px;
            height: calc(100vh - 57px);
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ── Panels ── */
        .panel {
            background: linear-gradient(145deg, #111e30, #152236);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 6px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .users-panel {
            flex: 50;
        }

        .logs-panel {
            flex: 50;
        }

        .panel-header {
            padding: 13px 18px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: #7aa4c8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .panel-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-icon {
            font-size: 14px;
            opacity: 0.75;
        }

        .panel-body {
            padding: 14px;
            flex: 1;
            overflow-y: auto;
        }

        /* ── Tables ── */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
            color: #dde6f0;
        }

        th {
            padding: 10px;
            color: #7aa4c8;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        table tr:last-child td {
            border-bottom: none;
        }

        table tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        /* ── Inputs & Buttons ── */
        input[type="text"], input[type="password"], select {
            background: rgba(7, 13, 23, 0.5);
            border: 1px solid rgba(77, 163, 255, 0.2);
            color: #dde6f0;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            width: 100%;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, input[type="password"]:focus, select:focus {
            outline: none;
            border-color: #4da3ff;
            box-shadow: 0 0 0 2px rgba(77, 163, 255, 0.2);
        }

        select {
            cursor: pointer;
        }

        .btn {
            background: linear-gradient(135deg, #4da3ff, #007bff);
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: opacity 0.2s;
            width: 100%;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .no-data {
            text-align: center;
            color: #3a5570;
            font-size: 13px;
            padding: 20px;
        }

        /* ── Responsive ── */
        @media (max-width: 1000px) {
            .dashboard {
                flex-direction: column;
                height: auto;
            }
        }
    </style>
</head>

<body>

    <div class="topbar">
        <div class="topbar-left">
            <h1><span>Admin</span> Dashboard</h1>
        </div>
        <div class="topbar-right">
            <div class="status-pill">
                <div class="status-dot"></div>
                Admin Live
            </div>
        </div>
    </div>

    <div class="dashboard">

        <!-- LEFT: Users Management -->
        <div class="panel users-panel">
            <div class="panel-header">
                <div class="panel-header-left">
                    <span class="panel-icon">👥</span>
                    Users Management
                </div>
            </div>
            <div class="panel-body">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 5%;">ID</th>
                            <th style="width: 25%;">Username</th>
                            <th style="width: 25%;">New Password</th>
                            <th style="width: 20%;">Permissions</th>
                            <th style="width: 25%;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-table-body">
                        <!-- User rows will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- RIGHT: System Logs -->
        <div class="panel logs-panel">
            <div class="panel-header">
                <div class="panel-header-left">
                    <span class="panel-icon">📋</span>
                    System Logs (last 100)
                </div>
            </div>
            <div class="panel-body">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Type</th>
                            <th>Description</th>
                            <th>Value</th>
                            <th>Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body">
                        <!-- Log rows will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        // Build a <td> containing text — uses textContent to prevent XSS.
        function buildTextCell(text) {
            const td = document.createElement('td');
            td.textContent = text;
            return td;
        }

        // Fetch and display users. All user-controlled strings are injected
        // via .value / .textContent, never as innerHTML — otherwise a username
        // like `"><img src=x onerror=...>` would execute in every admin's browser.
        async function loadUsers() {
            try {
                const response = await fetch('/admin/users');
                const data = await response.json();

                const tbody = document.getElementById('users-table-body');
                tbody.replaceChildren();

                data.users.forEach(user => {
                    const tr = document.createElement('tr');

                    tr.appendChild(buildTextCell(user.user_id));

                    const tdUser = document.createElement('td');
                    const usernameInput = document.createElement('input');
                    usernameInput.type = 'text';
                    usernameInput.id = `username-${user.user_id}`;
                    usernameInput.value = user.username;   // .value is never parsed as HTML
                    tdUser.appendChild(usernameInput);
                    tr.appendChild(tdUser);

                    const tdPwd = document.createElement('td');
                    const pwdInput = document.createElement('input');
                    pwdInput.type = 'password';
                    pwdInput.id = `password-${user.user_id}`;
                    pwdInput.placeholder = 'Leave blank to keep';
                    tdPwd.appendChild(pwdInput);
                    tr.appendChild(tdPwd);

                    const tdPerm = document.createElement('td');
                    const permSelect = document.createElement('select');
                    permSelect.id = `perm-${user.user_id}`;
                    permSelect.className = 'select-permissions';
                    for (const p of ['user', 'Admin']) {
                        const opt = document.createElement('option');
                        opt.value = p;
                        opt.textContent = p === 'user' ? 'User' : 'Admin';
                        if (user.permissions === p) opt.selected = true;
                        permSelect.appendChild(opt);
                    }
                    tdPerm.appendChild(permSelect);
                    tr.appendChild(tdPerm);

                    const tdAction = document.createElement('td');
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.textContent = '🛠️ Update';
                    btn.addEventListener('click', () => updateUser(user.user_id));
                    tdAction.appendChild(btn);
                    tr.appendChild(tdAction);

                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        // Update full user (permissions, username, password)
        async function updateUser(userId) {
            const newUsername = document.getElementById(`username-${userId}`).value;
            const newPassword = document.getElementById(`password-${userId}`).value;
            const newPermissions = document.getElementById(`perm-${userId}`).value;

            try {
                const response = await fetch(`/admin/users/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        username: newUsername,
                        password: newPassword, // it's sent empty if unchanged, the backend ignores it
                        permissions: newPermissions
                    })
                });
                const result = await response.json();
                
                if (response.ok) {
                    alert('Success: ' + result.message);
                    loadUsers(); // reload to refresh fields
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                console.error('Error updating user:', error);
                alert('An error occurred.');
            }
        }

        // Fetch and display logs. log.description is populated by the sensor
        // ingest endpoints (attacker-controlled on /api/blog/sensor_data) —
        // rendering it with textContent prevents stored XSS in the admin view.
        async function loadLogs() {
            try {
                const response = await fetch('/admin/logs');
                const data = await response.json();

                const tbody = document.getElementById('logs-table-body');
                tbody.replaceChildren();

                if (data.logs.length === 0) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.colSpan = 5;
                    td.className = 'no-data';
                    td.textContent = 'No logs found';
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                    return;
                }

                data.logs.forEach(log => {
                    const tr = document.createElement('tr');
                    tr.appendChild(buildTextCell(log.id));
                    tr.appendChild(buildTextCell(log.eventtype));
                    tr.appendChild(buildTextCell(log.description || '-'));
                    tr.appendChild(buildTextCell(log.value !== null ? log.value : '-'));
                    tr.appendChild(buildTextCell(log.timestamp || '-'));
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error('Error loading logs:', error);
            }
        }

        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            loadUsers();
            loadLogs();
        });
    </script>
</body>

</html>
